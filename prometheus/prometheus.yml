global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # TODO: Add Blackbox Exporter probe jobs in a later milestone.
  # Example targets should use local placeholders such as 192.168.68.1.
  # Do not hardcode your public IP address.

