services:
  prometheus:
    image: prom/prometheus:latest
    container_name: home-network-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    # TODO: Add persistent Prometheus storage in a later milestone.

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: home-network-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

  # TODO: Add Grafana after the first Prometheus/Blackbox checks are working.

