modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      method: GET
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0

  tcp_connect:
    prober: tcp
    timeout: 5s

  dns_google_com:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: google.com
      query_type: A
      valid_rcodes:
        - NOERROR

# Edit or add modules here as the project grows.
# ICMP probes require NET_RAW capability in docker-compose.yml.
