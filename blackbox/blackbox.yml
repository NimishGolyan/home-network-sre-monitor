modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0

  tcp_connect:
    prober: tcp
    timeout: 5s

# TODO: Confirm which probes work reliably on Raspberry Pi Docker.
# ICMP probes may need additional container permissions in a later milestone.

